[package]
name = "nenia"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A small, lossless, deduplicating vault for agent traces"
license = "MIT"

[dependencies]
anyhow = "1"
blake3 = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
walkdir = "2"
zstd = "=0.13.3"
# Native-container reconstruction is a versioned format, not a floating encoder.
zstd-sys = { version = "=2.1.2", default-features = false }
object_store = { version = "0.12", features = ["aws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net", "sync", "process"] }
futures = "0.3"
url = "2"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
getrandom = "0.3"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true

