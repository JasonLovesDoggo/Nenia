[package]
name = "nenia"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A small, lossless, deduplicating vault for agent traces"
license = "MIT"

[dependencies]
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
walkdir = "2"
zstd = "0.13"
object_store = { version = "0.12", features = ["aws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
url = "2"

[profile.release]
lto = "thin"
strip = true

