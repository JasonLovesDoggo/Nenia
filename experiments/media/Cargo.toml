[package]
name = "nenia-media-screen"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
nenia-codecs = { path = "../../crates/codecs", features = ["legacy-preflate"] }
anyhow = "1"
blake3 = "1"
serde_json = "1"
zstd = "0.13"
preflate-rs = "=0.7.6"
flate2 = "1"
webp = { version = "=0.3.1", default-features = false }
serde = { version = "1", features = ["derive"] }
lepton_jpeg = "=0.5.5"
fdeflate = "=0.3.7"
base64 = "0.22"
tempfile = "3"
jxl-oxide = { version = "=0.12.6", default-features = false }
zlib-rs = { version = "=0.6.8", default-features = false, features = ["std"] }

[[bin]]
name = "reconstruct"
path = "src/reconstruct.rs"

[[bin]]
name = "pixel-share"
path = "src/pixel_share.rs"

[[bin]]
name = "jpeg-screen"
path = "src/jpeg_screen.rs"

[[bin]]
name = "temporal"
path = "src/temporal.rs"

[[bin]]
name = "trace-archive"
path = "src/trace_archive.rs"

[[bin]]
name = "jpeg-share"
path = "src/jpeg_share.rs"

[[bin]]
name = "jxl-screen"
path = "src/jxl_screen.rs"

[[bin]]
name = "sprites"
path = "src/sprites.rs"

[[bin]]
name = "pixel-plan"
path = "src/pixel_plan.rs"
